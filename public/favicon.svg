<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Outer subtle glowing border ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Modern Deployment Stack / Cloud Layers -->
  <!-- Top Layer / Platform -->
  <path d="M32 14 L48 22 L32 30 L16 22 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Middle Layer -->
  <path d="M16 26 L32 34 L48 26 L48 29 L32 37 L16 29 Z" fill="url(#accentGrad)" fill-opacity="0.85" />

  <!-- Bottom Layer -->
  <path d="M16 33 L32 41 L48 33 L48 36 L32 44 L16 36 Z" fill="url(#accentGrad)" fill-opacity="0.6" />

  <!-- Speed indicator / Pulse dot -->
  <circle cx="32" cy="48" r="2.5" fill="#38bdf8" filter="url(#glow)" />
</svg>